<div class="abilities-page">
  <div class="abilities-options">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <mat-label>Search abilities</mat-label>
      <input
        matInput
        [value]="searchValue()"
        (input)="onSearchInput($any($event.target).value)"
      />
    </mat-form-field>
  </div>

  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  } @else {
    <div class="abilities-table-container">
      <div class="abilities-table-scroll">
        <table mat-table [dataSource]="paginatedAbilities()" class="abilities-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let ability">
              <a class="ability-link" [routerLink]="['/abilities', ability.name]">{{
                ability.displayName
              }}</a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let ability; columns: displayedColumns" class="ability-row"></tr>
        </table>
      </div>
      <mat-paginator
        (page)="onPageChange($event)"
        [length]="filteredAbilities().length"
        [pageIndex]="pageEvent().pageIndex"
        [pageSize]="pageEvent().pageSize"
        [pageSizeOptions]="[25, 50, 100]"
        [showFirstLastButtons]="true"
        aria-label="Ability pagination"
      ></mat-paginator>
    </div>
  }
</div>
